server.port=8201
spring.application.name=loadbalanced-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# "lb://" tells the gateway to resolve "example-service" via the LoadBalancerClient,
# spreading requests across every registered instance of that service.
spring.cloud.gateway.routes[0].id=load_balanced_route
spring.cloud.gateway.routes[0].uri=lb://example-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/loadbalanced/**
