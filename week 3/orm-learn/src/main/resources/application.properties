# =========================================================================
# Spring Framework and application log  (Hands on 1)
# =========================================================================
logging.level.org.springframework=info
logging.level.com.cognizant=debug

# Hibernate logs for displaying executed SQL, input and output
logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.type.descriptor.sql=trace

# Log pattern
logging.pattern.console=%d{dd-MM-yy} %d{HH:mm:ss.SSS} %-20.20thread %5p %-25.25logger{25} %25M %4L %m%n

# =========================================================================
# Database configuration
# -------------------------------------------------------------------------
# Default: H2 in-memory database so this project runs immediately without
# installing MySQL Server. This is functionally identical to the ormlearn
# MySQL schema used in the hands-on document.
#
# To use MySQL instead (as described in Hands on 1 of the document):
#   1) Uncomment the mysql-connector-java dependency in pom.xml
#   2) Comment out the H2 block below and uncomment the MySQL block
#   3) Run: mysql -u root -p -> create schema ormlearn;
# =========================================================================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:ormlearn;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.url=jdbc:mysql://localhost:3306/ormlearn
# spring.datasource.username=root
# spring.datasource.password=root

# Hibernate configuration
# create-drop lets the H2 schema be (re)built from the entities on every
# run, then data.sql seeds the same data used throughout the hands-on.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

# Ensure data.sql runs after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 console (handy for eyeballing tables while the app is running)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
