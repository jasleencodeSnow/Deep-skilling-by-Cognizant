# =========================================================================
# Exercise 1: Configuring Application Properties for H2 database connection
# =========================================================================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Exercise 10: Configuring Hibernate dialect and properties for optimal performance
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace

# H2 console (Exercise 9 - inspect the datasource while the app is running)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Exercise 9: Externalizing configuration - example of a second, named
# datasource. Not auto-wired as the primary DataSource; see
# config/SecondaryDataSourceConfig.java for how it is bound and used.
app.datasource.audit.url=jdbc:h2:mem:auditdb
app.datasource.audit.driverClassName=org.h2.Driver
app.datasource.audit.username=sa
app.datasource.audit.password=password
